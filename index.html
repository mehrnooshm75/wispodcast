<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Women in Science</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:linear-gradient(135deg,#0B1020,#1A1333,#121826);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
overflow:hidden;
color:white;

}

body::before{

content:"";
position:fixed;
width:350px;
height:350px;
background:#FFD54F33;
filter:blur(120px);
top:-120px;
left:-120px;

}

body::after{

content:"";
position:fixed;
width:300px;
height:300px;
background:#7C4DFF33;
filter:blur(120px);
bottom:-80px;
right:-80px;

}

.card{

width:100%;
max-width:420px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.15);

border-radius:28px;

padding:40px;

text-align:center;

box-shadow:0 20px 50px rgba(0,0,0,.35);

}

.logo{

font-size:58px;
margin-bottom:15px;

}

h1{

font-size:34px;
margin-bottom:10px;

}

.subtitle{

opacity:.8;
margin-bottom:35px;
line-height:1.6;

}

.button{

display:flex;

justify-content:center;

align-items:center;

text-decoration:none;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.12);

padding:18px;

border-radius:18px;

margin-bottom:16px;

color:white;

font-weight:600;

transition:.3s;

}

.button:hover{

transform:translateY(-4px);

background:#FFD54F;

color:#111;

}

.footer{

margin-top:25px;

opacity:.6;

font-size:13px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">🔬</div>

<h1>Women in Science</h1>

<div class="subtitle">
Hosted by<br>
<strong>Mehrnoosh Mojabi</strong>
</div>

<a class="button" href="#">🎙 Latest Episode</a>

<a class="button" href="#">🎧 Castbox</a>

<a class="button" href="#">🎵 Spotify</a>

<a class="button" href="#">📺 YouTube</a>

<a class="button" href="#">📷 Instagram</a>

<a class="button" href="#">💼 LinkedIn</a>

<a class="button" href="#">🌐 Website</a>

<div class="footer">
Made with ❤️ using GitHub Pages
</div>

</div>

</body>
</html>
